<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="oklch(95.64% 0.016 289.93%)" />
		<meta
			name="theme-color"
			content="oklch(11.85% 0.03 286.18)"
			media="(prefers-color-scheme: dark)"
		/>
		%sveltekit.head%

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon/favicon-16x16.png"
		/>
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<meta property="og:title" content="LogiApp | Plataforma de Logística" />
		<meta
			property="og:description"
			content="Bienvenido a LogiApp, la plataforma de logística que te ayuda a gestionar tus envíos de manera eficiente y efectiva.
			Desde la planificación hasta la entrega, LogiApp te ofrece herramientas para optimizar tu cadena de suministro y mejorar la experiencia del cliente."
		/>
		<meta property="og:image" content="https://bombayv.com/favicon/apple-touch-icon.png" />
		<meta property="og:image:width" content="48" />
		<meta property="og:image:height" content="48" />
		<meta name="author" content="BombayV" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
