name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup Bun (for Turborepo and Next.js) ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # --- Setup Go ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # --- Setup Flutter ---
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Use a specific version
          channel: 'stable'

      # --- Install, Build, and Lint ---
      - name: Install root dependencies
        run: bun install

      - name: Lint all projects
        run: turbo run lint

      - name: Build all projects
        run: turbo run build
